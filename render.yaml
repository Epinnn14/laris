# One-click deploy on Render (free web service) with the database on Neon (free Postgres that
# does not expire). Render's free disk is wiped on every restart, so the data must live in Postgres.
# See docs/DEPLOY.md.
services:
  - type: web
    name: laris
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: LARIS_DATABASE_URL     # paste the Neon connection string (postgresql://...?sslmode=require)
        sync: false
      - key: LARIS_SECURE_COOKIE
        value: "1"
      - key: TZ
        value: Asia/Jakarta
